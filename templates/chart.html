<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Stock Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.07);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 35px;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 150px 1fr 65px;
            gap: 12px;
            align-items: center;
            margin: 17px 0;
        }

        .product-name {
            font-weight: 600;
            overflow-wrap: anywhere;
        }

        .bar-background {
            height: 25px;
            background: #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .stock-progress {
    width: 100%;
    height: 25px;
    border: none;
    border-radius: 20px;
    overflow: hidden;
    appearance: none;
}

.stock-progress::-webkit-progress-bar {
    background: #e5e7eb;
    border-radius: 20px;
}

.stock-progress::-webkit-progress-value {
    background: #2563eb;
    border-radius: 20px;
}

.stock-progress::-moz-progress-bar {
    background: #2563eb;
    border-radius: 20px;
}
            

        .quantity {
            font-weight: bold;
            text-align: right;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            background: #1e40af;
            color: white;
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 7px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 16px;
            }

            .chart-row {
                grid-template-columns: 95px 1fr 45px;
                gap: 7px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Inventory Stock Analysis</h1>

        <p class="subtitle">
            Current Stock Quantity by Product
        </p>

        {% if chart_data %}

            {% for item in chart_data %}

            <div class="chart-row">

                <div class="product-name">
                    {{ item.name }}
                </div>

                <div class="bar-background">
    <progress
        class="stock-progress"
        value="{{ item.percentage }}"
        max="100">
    </progress>
</div>

                <div class="quantity">
                    {{ item.quantity }}
                </div>

            </div>

            {% endfor %}

        {% else %}

            <p>No product data available.</p>

        {% endif %}

        <a href="/" class="back-button">
            Back to Dashboard
        </a>

    </div>

</body>
</html>
